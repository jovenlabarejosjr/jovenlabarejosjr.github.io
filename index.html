<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Joven Labarejos — AI Automation Specialist</title>
<meta name="description" content="AI Automation Specialist & n8n Engineer. I help businesses eliminate manual work and scale with intelligent workflow systems." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0c1938;
  --bg2: #0a1530;
  --bg3: #081228;
  --surface: #112048;
  --surface2: #162550;
  --teal: #0398aa;
  --teal2: #027a8a;
  --teal-dim: rgba(3,152,170,0.12);
  --amber: #fd610f;
  --amber2: #e5560d;
  --text: #e4e5ea;
  --text2: #9aa3b8;
  --text3: #5a6680;
  --border: rgba(3,152,170,0.18);
  --border2: rgba(255,255,255,0.07);
  --font-display: 'Montserrat', sans-serif;
  --font-body: 'Montserrat', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --r: 12px;
  --r2: 24px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
  line-height: 1.7;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(3,152,170,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(3,152,170,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

main,
nav,
footer {
  position: relative;
  z-index: 2;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  background: rgba(12,25,56,0.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border2);
  z-index: 100;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
</html>
